
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --prefer-dist --no-progress

      # Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # Start API for backend tests
      - name: Start PHP API server
        working-directory: ./backend
        run: |
          php -S 127.0.0.1:8099 -t public public/index.php > /tmp/enlazate-api.log 2>&1 &
          echo $! > /tmp/enlazate-api.pid

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8099/api/health; then
              echo "API disponible"
              exit 0
            fi
            sleep 1
          done
          echo "La API no inició correctamente"
          cat /tmp/enlazate-api.log
          exit 1

      - name: Run PHP tests
        working-directory: ./backend
        run: composer test
